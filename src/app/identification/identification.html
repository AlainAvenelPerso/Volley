<div class="identification-container">
  <!-- @if (isConnected == false) { -->
  <section class="id-card">
    <h3>Connexion</h3>

    <p class="muted">Entrez le nom de l'équipe et le mot de passe</p>
    @if (isLoadingEquipes) {
      <p class="loading-message">Chargement des équipes en cours...</p>
    }
    @if (loginErrorMessage) {
      <p class="error-message">{{ loginErrorMessage }}</p>
    }
    <form class="login-form" (ngSubmit)="loginSupabase()" autocomplete="off">
    <!-- Dropdown des équipes -->
    <label class="visually-hidden" for="team">Equipe</label>
    <select id="team" [(ngModel)]="code_equipe" (ngModelChange)="clearLoginError()" name="code_equipe" required autocomplete="off">
        @for (equipe of equipesAll$ | async; track equipe.code) {
      <option [value]="equipe.code">
        {{ equipe.nom }} ({{ equipe.nomCategorie }})
      </option>
    }
    </select>
      <label class="visually-hidden" for="password">Mot de passe</label>
      <div class="pwd-field">
        <input id="password" class="pwd-input" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" (ngModelChange)="clearLoginError()" placeholder="Mot de passe" name="password" required autocomplete="new-password" />
        <button type="button" class="pwd-toggle" (click)="toggleShowPassword()" [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'" [attr.aria-pressed]="showPassword">
          <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary">Se connecter</button>
      </div>
    </form>

  </section>
   <!-- } -->
    <!-- @else {
    <section class="id-card welcome">
      <h3>Bienvenue</h3>
      <p class="muted">Vous êtes connecté en tant que <strong>{{code_equipe}}</strong></p>
      <div class="actions">
        <button (click)="disconnect()" class="btn-ghost">Déconnexion</button>
      </div>
    </section>
    } -->
</div>
