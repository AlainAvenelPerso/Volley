    <h2 mat-dialog-title>{{ data.title }}</h2>
    <mat-dialog-content class="message" [innerHTML]="safeMessage"></mat-dialog-content>

    <mat-dialog-actions align="end">
      @if (data.onlyOK) {
        <button mat-raised-button color="primary" (click)="onConfirm()">OK</button>
      } 
      @else {
              <button mat-button (click)="onCancel()">Annuler</button>
      &nbsp;&nbsp;&nbsp;&nbsp;
      <button mat-raised-button color="primary" (click)="onConfirm()">Confirmer</button>
      }
      

    </mat-dialog-actions>
